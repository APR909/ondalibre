name: OndaLibre automated quality checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: Project integrity, core logic and privacy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          for file in app.js stations.js stats.js auth.js auth-config.js now-playing.js theme.js tests/*.cjs playwright.config.cjs; do
            node --check "$file"
          done
      - name: Run all dependency-free tests
        run: npm test

  browser:
    name: Browser UI on desktop and Android viewport
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Playwright test runner
        run: npm install --no-audit --no-fund
      - name: Install Chromium and system dependencies
        run: npx playwright install chromium --with-deps
      - name: Run browser smoke tests
        run: npm run test:browser
      - name: Upload screenshots and traces if tests fail
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-artifacts
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7
